<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peakbook: Your Climbing Logbook</title>
  <meta name="description" content="Track the mountains you've climbed. See your stats, your map, and your progress on the great peak lists." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏔</text></svg>" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="app">

    <!-- ===== Sidebar ===== -->
    <nav class="sidebar">
      <div class="brand">
        <div class="brand-mark">▲</div>
        <div class="brand-name">Peakbook</div>
      </div>

      <div class="nav-items">
        <button class="nav-item active" data-view="dashboard">
          <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg></span>
          <span class="nav-label">Dashboard</span>
        </button>
        <button class="nav-item" data-view="explore">
          <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg></span>
          <span class="nav-label">Explore</span>
        </button>
        <button class="nav-item" data-view="map">
          <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9a.5.5 0 0 0-.36.48V20.5a.5.5 0 0 0 .5.5l.16-.03L9 18.9l6 2.1 5.64-1.9a.5.5 0 0 0 .36-.48V3.5a.5.5 0 0 0-.5-.5zM15 19l-6-2.11V5l6 2.11V19z"/></svg></span>
          <span class="nav-label">Map</span>
        </button>
        <button class="nav-item" data-view="lists">
          <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 10.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm0-6a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm0 12a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zM8 19h13v-2H8v2zm0-6h13v-2H8v2zm0-8v2h13V5H8z"/></svg></span>
          <span class="nav-label">Lists</span>
        </button>
      </div>

      <div class="sidebar-footer">
        <div class="account-area" id="account-area"></div>
        <button class="ghost-btn" id="btn-export" title="Download your logbook as JSON">Export data</button>
        <button class="ghost-btn" id="btn-import" title="Restore a logbook JSON file">Import data</button>
        <input type="file" id="import-file" accept="application/json" hidden />
      </div>
    </nav>

    <!-- ===== Main ===== -->
    <main class="main">

      <!-- Dashboard -->
      <section class="view active" id="view-dashboard">
        <div class="account-area account-area-mobile" id="account-area-mobile"></div>
        <header class="view-header">
          <div>
            <h1 id="greeting">Your logbook</h1>
            <p class="subtitle" id="dash-subtitle">Track the peaks you've climbed.</p>
          </div>
          <button class="primary-btn" id="btn-log-climb">+ Log a climb</button>
        </header>
        <div id="dashboard-content"></div>
      </section>

      <!-- Explore -->
      <section class="view" id="view-explore">
        <header class="view-header">
          <div>
            <h1>Explore peaks</h1>
            <p class="subtitle"><span id="explore-count"></span> mountains to search and log</p>
          </div>
        </header>
        <div class="search-row">
          <div class="search-box">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
            <input type="search" id="search-input" placeholder="Search mountains, ranges, countries…" autocomplete="off" />
          </div>
        </div>
        <div class="filter-row" id="filter-row"></div>
        <div class="peak-grid" id="peak-grid"></div>
      </section>

      <!-- Map -->
      <section class="view" id="view-map">
        <div id="map-canvas"></div>
        <div class="map-overlay">
          <div class="map-legend">
            <span class="legend-item"><span class="dot dot-climbed"></span>Climbed</span>
            <span class="legend-item"><span class="dot dot-unclimbed"></span>Not yet</span>
          </div>
          <label class="map-toggle">
            <input type="checkbox" id="map-show-all" checked />
            <span>Show unclimbed peaks</span>
          </label>
        </div>
        <div class="map-stats" id="map-stats"></div>
      </section>

      <!-- Lists -->
      <section class="view" id="view-lists">
        <header class="view-header">
          <div>
            <h1>Peak lists</h1>
            <p class="subtitle">The classic collections, and your progress on each</p>
          </div>
        </header>
        <div id="lists-content"></div>
      </section>

    </main>

    <!-- ===== Mobile tab bar ===== -->
    <nav class="tabbar">
      <button class="tab-item active" data-view="dashboard"><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg><span>Home</span></button>
      <button class="tab-item" data-view="explore"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg><span>Explore</span></button>
      <button class="tab-item" data-view="map"><svg viewBox="0 0 24 24"><path d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9a.5.5 0 0 0-.36.48V20.5a.5.5 0 0 0 .5.5l.16-.03L9 18.9l6 2.1 5.64-1.9a.5.5 0 0 0 .36-.48V3.5a.5.5 0 0 0-.5-.5zM15 19l-6-2.11V5l6 2.11V19z"/></svg><span>Map</span></button>
      <button class="tab-item" data-view="lists"><svg viewBox="0 0 24 24"><path d="M4 10.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm0-6a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm0 12a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zM8 19h13v-2H8v2zm0-6h13v-2H8v2zm0-8v2h13V5H8z"/></svg><span>Lists</span></button>
    </nav>

  </div>

  <!-- ===== Modal ===== -->
  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>

  <!-- ===== Toast ===== -->
  <div class="toast" id="toast" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/data.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
